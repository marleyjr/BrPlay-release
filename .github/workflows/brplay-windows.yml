name: BRPLAY Windows

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brplay-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      BR_CATALOG_API_URL: ${{ secrets.BR_CATALOG_API_URL }}
      BR_CATALOG_API_KEY: ${{ secrets.BR_CATALOG_API_KEY }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
      OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true
      - name: Check required settings and WiX
        shell: pwsh
        run: |
          foreach ($name in 'TG_API_ID', 'TG_API_HASH', 'BR_CATALOG_API_URL', 'BR_CATALOG_API_KEY', 'TMDB_API_KEY') {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Configure the repository secret: $name"
            }
          }
          if ($env:BR_CATALOG_API_URL -notmatch '^https://') { throw 'Use an HTTPS catalog URL.' }
          if ($env:WIX) { "$env:WIX\bin" | Out-File -FilePath $env:GITHUB_PATH -Append }
      - name: Test shared catalog
        shell: pwsh
        run: .\gradlew.bat :core:jvmTest --tests 'com.tmplayer.catalog.*' --no-daemon --max-workers=2 '-Pkotlin.compiler.execution.strategy=in-process'
      - name: Test desktop catalog
        shell: pwsh
        run: .\gradlew.bat :desktop:test --tests 'com.tmplayer.desktop.CatalogDesktopTest' --no-daemon --max-workers=2 '-Pkotlin.compiler.execution.strategy=in-process'
      - name: Build Windows installer
        shell: pwsh
        run: .\gradlew.bat :desktop:packageReleaseMsi '-PdesktopVersion=1.0.0' --no-daemon --max-workers=2 '-Pkotlin.compiler.execution.strategy=in-process'
      - uses: actions/upload-artifact@v7
        with:
          name: BRPLAY-Windows-1.0.0
          path: desktop/build/compose/binaries/main-release/msi/*.msi
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: BRPLAY-test-reports
          path: |
            core/build/reports/tests/
            desktop/build/reports/tests/
          retention-days: 3
